<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

iframe {
  position: absolute;
  top: -50px;
  left: 0;
  width: 100%;
  height: calc(100vh + 50px);
  border: none;
}
</style>
</head>
<body>

<iframe id="appFrame"></iframe>

<script>
const baseURL = "https://script.google.com/macros/s/AKfycbxfgF8krp27WUDfEtLlLValFsvWDzNsjOu-w1gaD5v-9oJEAmbun90b7Evv99tjPSu2dQ/exec";

function loadApp() {
  const isMobile = window.innerWidth <= 768;
  const url = isMobile ? baseURL + "?view=mobile" : baseURL;
  document.getElementById("appFrame").src = url;
}

loadApp();

window.addEventListener("resize", loadApp);
</script>

</body>
</html>
